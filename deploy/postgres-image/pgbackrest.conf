# pgBackRest for the knowledge-layer cell (slice I4, ADR 0006). In dev the repository is the kl-pgbackrest Docker
# volume; in production, point repo1 at object storage (repo1-type=s3, gcs, or azure) and keep the cipher pass in
# a secrets manager. The cipher pass and the database user come from the environment (PGBACKREST_*).
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=off

[kl]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
