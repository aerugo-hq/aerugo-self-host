# The development credentials docker-compose.yml defaults to: fine on your machine, never on a cluster others reach.
apiVersion: v1
kind: Secret
metadata:
  name: aerugo-dev
type: Opaque
stringData:
  owner-password: owner-dev-only
  app-password: app-dev-only
  ingest-password: ingest-dev-only
  fga-password: fga-dev-only
  backup-cipher: backup-dev-only
  keycloak-admin-password: admin-dev-only
  openbao-token: dev-root-token
  database-url: postgresql://kl_app:app-dev-only@postgres:5432/kl
  ingest-database-url: postgresql://kl_ingest:ingest-dev-only@postgres:5432/kl
  owner-database-url: postgresql://kl_owner:owner-dev-only@postgres:5432/kl
  fga-datastore-uri: postgres://kl_fga:fga-dev-only@postgres:5432/openfga?sslmode=disable
