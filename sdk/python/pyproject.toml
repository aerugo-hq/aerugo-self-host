[project]
name = "aerugo"
version = "0.1.0"
description = "Aerugo's Python client: search, Ask, documents, the change feed, and pipeline pushes, as the token's own user."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aerugo"]
