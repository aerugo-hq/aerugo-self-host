# Keeps pinned actions, Python dependencies, and the API base image current.
# The cooldown waits a few days after a release before proposing it (supply-chain hygiene).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
