# Release gate: the smoke suite (every leak check) and the evaluation set (no leak, and no regression against its
# baseline, kl/evals_baseline.json) must pass on every push and PR.
name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: The Python and TypeScript clients' tests
        run: make sdk-test

      - name: The web app's lint (L2)
        run: make lint-web

      - name: The web app's unit tests (L3)
        run: make test-web

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Every image Aerugo ships is pinned by digest (L1)
        run: make pins

      - name: Unit tests (who reads what, the parsers, the claim checker), before anything starts
        run: make unit

      - name: Provision the stack
        run: make up

      - name: Smoke suite
        run: make smoke

      - name: Golden set (no leak; no regression against its baseline)
        run: make eval

      - name: Evaluation set (no leak; no regression against the baseline)
        run: make eval-scenario

      - name: The synthetic retailer, F9 (each person opens exactly what its truth says; no leak; no regression)
        run: make eval-company

      - name: The synthetic enterprise, F10b (the Atlas holds exactly what its sources reveal; each person sees exactly its truth; no regression)
        run: make atlas-eval

      - name: Question sets per team, F7 (each team's questions asked as its people; no leak; each team at its baseline)
        run: make eval-teams

      - name: The retailer with pointers only, F11a (no text kept; answers read it live, for who the source lists; no leak; no regression)
        run: make eval-company-pointer

      - name: The retailer live only, F11b (Confluence and Jira found through their own search, nothing but titles and readers kept; no leak; no regression)
        run: make eval-company-live

      - name: No pointer's text in the services' logs (F11a's smoke check plants it in every source it reads)
        run: test "$(docker compose --profile smoke logs --no-color api worker mcp answers 2>&1 | grep -c ptr-marker)" = 0

      - name: Service logs
        if: failure()
        run: docker compose --profile smoke logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: make reset
