# Release gate: the smoke suite (every leak check) and the evaluation set (no leak, and no regression against its
# baseline, kl/evals_baseline.json) must pass on every push and PR.
name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: The Python and TypeScript clients' tests
        run: make sdk-test

      - name: The web app's lint (L2)
        run: make lint-web

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Unit tests (who reads what, the parsers, the claim checker), before anything starts
        run: make unit

      - name: Provision the stack
        run: make up

      - name: Smoke suite
        run: make smoke

      - name: Golden set (no leak; no regression against its baseline)
        run: make eval

      - name: Evaluation set (no leak; no regression against the baseline)
        run: make eval-scenario

      - name: Service logs
        if: failure()
        run: docker compose --profile smoke logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: make reset
